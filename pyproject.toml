[project]
name = "mm-rag-platform"
version = "0.1.0"
description = "Modular monorepo for a multimodal RAG platform over PDFs"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.1",
    "qdrant-client>=1.12",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    "pillow>=10.4",
    "pandas>=2.2",
    "tabulate>=0.9",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps", "workers"]
